[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snapboard-manta"
version = "0.3.0"
description = "SnapBoard Manta — local-first kanban board in the SnapDock ecosystem"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

authors = [
  { name = "ZFordDev", email = "zforddev@gmail.com" }
]
maintainers = [
  { name = "ZFordDev", email = "zforddev@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "PySide6",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[tool.setuptools]
packages = ["snapboard"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "SIM", "BLE"]
# N802: PySide6 requires camelCase override names (insertFromMimeData, keyPressEvent).
# BLE001: UI file/rendering code intentionally surfaces errors instead of crashing.
ignore = ["N802", "BLE001"]

[project.scripts]
snapboard-manta = "snapboard.main:main"