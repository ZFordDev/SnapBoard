name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install build dependencies
        run: python -m pip install -e ".[dev]" pyinstaller

      - name: Determine path separator for --add-data
        id: sep
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then echo "sep=;" >> "$GITHUB_OUTPUT"; else echo "sep=:" >> "$GITHUB_OUTPUT"; fi

      - name: Build standalone binary
        run: >
          pyinstaller --onefile --name snapboard-manta
          --add-data "snapboard/themes/*${{ steps.sep.outputs.sep }}snapboard/themes"
          --hidden-import snapboard.fonts
          --hidden-import snapboard.config
          --hidden-import snapboard.ui
          --hidden-import snapboard.ui.board
          --hidden-import snapboard.ui.carddialog
          --hidden-import snapboard.ui.column
          --hidden-import snapboard.ui.footer
          --hidden-import snapboard.ui.manager
          --hidden-import snapboard.ui.menubar
          --hidden-import snapboard.ui.models
          --hidden-import snapboard.ui.searchbar
          --hidden-import snapboard.ui.sidebar
          --hidden-import snapboard.ui.window
          snapboard/main.py

      - name: Smoke test the binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="dist/snapboard-manta.exe"; else BIN="dist/snapboard-manta"; fi
          "$BIN" --version || true

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/snapboard-manta
            dist/snapboard-manta.exe
          fail_on_unmatched_files: false